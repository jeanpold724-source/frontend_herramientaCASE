# 1. Servidor HTTP (Puerto 80) -> Redirección automática a HTTPS (Puerto 443)
server {
    listen 80;
    server_name 54.90.71.59.nip.io localhost;

    # Permitir validación de certificados Let's Encrypt por HTTP si es necesario
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirección 301 permanente a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS (Puerto 443) con SSL y Proxy Inverso
server {
    listen 443 ssl;
    server_name 54.90.71.59.nip.io localhost;

    # Certificados SSL generados por Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/54.90.71.59.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.90.71.59.nip.io/privkey.pem;

    # Parámetros de seguridad y rendimiento SSL/TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compresión Gzip para optimizar transferencia
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # 1. Reverse Proxy para las APIs del Backend (Spring Boot en puerto 8081)
    # Elimina problemas de CORS al ser procesado bajo el mismo origen en HTTPS
    location /api/ {
        proxy_pass http://host.docker.internal:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Reverse Proxy para WebSockets STOMP (/ws-nexus)
    location /ws-nexus {
        proxy_pass http://host.docker.internal:8081/ws-nexus;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Cache agresivo para assets estáticos con hash generados por Vite
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # 4. Enrutamiento para SPA (Single Page Application)
    # Redirige cualquier ruta a index.html para que React Router la resuelva en el cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página de error estándar para fallos de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
